  html,body{ height:100%; }
  body{
    margin:0;

  .shimmer-line{
    position:fixed;
    left:0; right:0; top:0;
    height:3px;
    background:linear-gradient(90deg, var(--gold-antique) 0%, var(--gold-bright) 20%, var(--gold) 50%, var(--gold-bright) 80%, var(--gold-antique) 100%);
    background-size:200% 100%;
    animation:shimmerMove 6s linear infinite;
  }
  @keyframes shimmerMove{ 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }
  @media (prefers-reduced-motion: reduce){ .shimmer-line{ animation:none; } }

  .card{
    max-width:560px;
    width:100%;
    background:var(--cream-light);
    border:1px solid var(--line-gold);
    border-radius:8px;
    box-shadow:0 30px 60px -30px rgba(75,88,50,0.35);
    padding:56px 44px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    width:460px;
    height:460px;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    background:var(--wm-url) center/contain no-repeat;
    opacity:0.08;
    pointer-events:none;
  }
  .card > *{ position:relative; z-index:1; }

  .portrait{
    width:148px;
    height:148px;
    margin:0 auto 30px;
    padding:5px;
    border-radius:50%;
    background:linear-gradient(115deg, var(--gold-antique) 0%, var(--gold-bright) 25%, var(--gold) 50%, var(--gold-bright) 75%, var(--gold-antique) 100%);
    background-size:260% 260%;
    animation:shimmerMove2 7s ease-in-out infinite;
    box-shadow:0 22px 50px -20px rgba(75,88,50,0.4);
  }
  .portrait img{
    display:block;
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
  }
  @keyframes shimmerMove2{ 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
  @media (prefers-reduced-motion: reduce){ .portrait{ animation:none; } }

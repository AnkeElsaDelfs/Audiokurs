<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mein Wort ist Erinnerung – Elsa &amp; Ella</title>
<meta name="description" content="Bald findest Du hier die neue Seite von Elsa &amp; Ella. Bis dahin: der kostenfreie Audiokurs „Raus aus dem Drama“.">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
  :root{
    --cream:        #F5EEDB;
    --cream-light:  #F7F1E2;
    --green:        #4B5832;
    --gold:         #D4AF37;
    --gold-antique: #886F1D;
    --gold-dark:    #695617;
    --gold-bright:  #EEDFB0;
    --line:         rgba(75,88,50,0.14);
    --line-gold:    rgba(136,111,29,0.38);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--green);
    color:var(--cream);
    font-family:'Cormorant Garamond', serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px 24px;
    position:relative;
    overflow-x:hidden;
  }

  .shimmer-line{
    position:fixed;
    left:0; right:0;
    height:3px;
    background:linear-gradient(90deg, var(--gold-antique) 0%, var(--gold-bright) 20%, var(--gold) 50%, var(--gold-bright) 80%, var(--gold-antique) 100%);
    background-size:200% 100%;
    animation:shimmerMove 6s linear infinite;
  }
  .shimmer-line.top{ top:0; }
  .shimmer-line.bottom{ bottom:0; }
  @keyframes shimmerMove{ 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }
  @media (prefers-reduced-motion: reduce){ .shimmer-line{ animation:none; } }

  .wrap{
    max-width:640px;
    width:100%;
    text-align:center;
    position:relative;
    z-index:1;
  }

  .eyebrow{
    font-family:'Cinzel', serif;
    font-size:13px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--gold-bright);
    opacity:0.85;
    margin:0 0 28px;
  }

  .signature-word{
    display:block;
    font-family:'Beau Rivage', cursive;
    font-size:clamp(52px, 11vw, 92px);
    color:var(--gold-bright);
    line-height:1;
    margin:0 0 8px;
  }

  h1{
    font-family:'Cinzel', serif;
    font-weight:500;
    font-size:clamp(22px, 3.4vw, 30px);
    letter-spacing:0.02em;
    color:var(--cream);
    margin:0 0 30px;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin:0 0 30px;
  }
  .divider .line{
    height:1px;
    width:64px;
    background:linear-gradient(90deg, transparent, var(--gold-antique), transparent);
  }
  .divider .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--gold);
  }

  p.lead{
    font-size:21px;
    line-height:1.75;
    color:rgba(245,238,219,0.92);
    margin:0 0 40px;
  }

  .btn{
    display:inline-block;
    font-family:'Cinzel', serif;
    font-size:14px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-decoration:none;
    padding:18px 38px;
    border-radius:2px;
    color:var(--gold-dark);
    background:linear-gradient(135deg, #F5ECD1 0%, var(--gold-bright) 45%, #E0C670 100%);
    border:1px solid rgba(136,111,29,0.4);
    box-shadow:0 20px 45px -18px rgba(0,0,0,0.5);
    transition:transform 0.25s ease, box-shadow 0.25s ease;
  }
  .btn:hover{
    transform:translateY(-2px);
    box-shadow:0 26px 55px -18px rgba(0,0,0,0.55);
  }

  footer{
    margin-top:56px;
    font-family:'Cinzel', serif;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(245,238,219,0.5);
  }
  footer a{
    color:rgba(245,238,219,0.7);
    text-decoration:none;
    border-bottom:1px solid rgba(238,223,176,0.3);
    margin:0 8px;
  }
  footer a:hover{ color:var(--gold-bright); border-color:var(--gold-bright); }
  footer .legal{ margin-top:14px; }
</style>
</head>
<body>
  <div class="shimmer-line top"></div>
  <div class="shimmer-line bottom"></div>

  <div class="wrap">
    <p class="eyebrow">Elsa &amp; Ella</p>
    <span class="signature-word">Erinnerung</span>
    <h1>Mein Wort ist Erinnerung</h1>

    <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>

    <p class="lead">
      Hier entsteht gerade etwas Neues für Dich. Bis es soweit ist,
      findest Du schon den kostenfreien Audiokurs „Raus aus dem Drama“ –
      mit Elsa &amp; Ella.
    </p>

    <a class="btn" href="/audiokurs">Zum Audiokurs</a>

    <footer>
      &copy; 2026 Elsa &amp; Ella
      <div class="legal">
        <a href="/impressum">Impressum</a>
        <a href="/datenschutz">Datenschutz</a>
      </div>
    </footer>
  </div>
</body>
</html>
